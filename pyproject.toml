[project]
name = "binoracle"
version = "0.1.0"
description = "Local LLM copilot for binary reverse engineering and exploitation, grounded on real analysis oracles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
authors = [{ name = "beafn28" }]
keywords = ["reverse-engineering", "exploitation", "llm", "local", "radare2", "angr", "ctf"]

# Core runtime uses ONLY the Python standard library (urllib, sqlite3, argparse).
# This keeps the tool fully local and installable with zero pip deps for the skeleton.
dependencies = []

[project.optional-dependencies]
# Analysis oracles are optional and load lazily. Install what you have/need.
elf = ["pyelftools>=0.30"]
pe = ["pefile>=2023.2.7"]
msi = ["olefile>=0.47"]
r2 = ["r2pipe>=1.8"]
symbolic = ["angr>=9.2"]
pwn = ["pwntools>=4.11"]
disasm = ["capstone>=5.0"]
cvss = ["cvss>=3.0"]
burp = ["mcp>=1.0"]
frida = ["frida>=16.0"]
docs = ["markdown>=3.5"]
all = ["pyelftools>=0.30", "pefile>=2023.2.7", "olefile>=0.47", "r2pipe>=1.8", "angr>=9.2", "capstone>=5.0", "pwntools>=4.11", "cvss>=3.0", "mcp>=1.0", "frida>=16.0"]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "pytest-timeout>=2.3", "cvss>=3.0", "pefile>=2023.2.7",
       "olefile>=0.47", "ruff>=0.17", "mypy>=1.10", "pytest-cov>=5.0", "coverage>=7.0"]

[project.scripts]
binoracle = "binoracle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["binoracle*"]

[tool.setuptools.package-data]
binoracle = ["kb/*.md", "kb/**/*.md", "kb/skills/LICENSE"]

[tool.pytest.ini_options]
# Real gap found live: a manual GitHub Actions ci.yml run ran for 4+ hours with no sign of
# finishing (eventually cancelled) with zero per-test safety net -- pytest-timeout was an
# installed dependency in some environments but was never actually a declared dependency NOR
# configured anywhere, so a genuinely hanging test (as opposed to a merely slow one) could
# consume the suite's entire run, and on CI, the whole job (no explicit timeout-minutes there
# either, so GitHub's own 360-minute default is the only backstop). 300s is set well above the
# slowest known-legitimate single operation this suite does on purpose (oracles/r2session.py's
# own internal timeouts: 180s for a fresh `aaa` full analysis, 90s for most individual r2
# commands) so it should never fire on a test that is merely slow-but-working, only on one that
# genuinely never returns. thread method (not the default signal-based one): this codebase
# spawns real subprocesses/threads itself (Docker, r2, angr) and signal-based interruption can't
# reliably land inside a blocking C-level wait the way a thread-based watchdog can.
timeout = 300
timeout_method = "thread"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow: pyflakes (F) only -- real correctness signals (unused imports, undefined
# names, unused variables, pointless f-strings), confirmed at zero as of this gate's introduction.
# The broader style/modernization rulesets (E-series line length & statement style, I001 import
# sorting, UP00x py3-upgrade rewrites) found thousands of PRE-EXISTING hits across this codebase's
# history (most of it written before this gate existed) -- enforcing those now would mean either a
# a mass mechanical reformat with real regression risk (confirmed live: the F401 auto-fix silently
# deleted two `try: import X` AVAILABILITY PROBES -- oracles/capstone_fallback.py's r2pipe check and
# workflows/autopoc.py's angr check -- because removing an "unused" import that exists ONLY to be
# caught by its own ImportError is invisible to a plain unused-import check; both were caught by
# diffing the fix and restored with a `# noqa: F401` before this gate was added) or ignoring real
# findings to get there faster. F-only is the honest, zero-regression baseline; broadening it is
# future "ongoing" work per ROADMAP.md, done rule-by-rule with the same scrutiny.
select = ["F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Advisory, not a hard gate yet: a first `mypy --ignore-missing-imports` pass over this codebase
# (written long before this config existed) found ~400 pre-existing errors across ~70 files --
# real signal (a few are genuine latent bugs worth triaging), but burying a brand-new CI gate
# under 400 failures on day one would just get it disabled. CI runs mypy and publishes the count
# so regressions are visible, without blocking the build on the existing backlog; promote files to
# a hard per-module gate as they're cleaned up, per ROADMAP.md's "ongoing" framing of this item.
warn_unused_ignores = false
no_implicit_optional = false
