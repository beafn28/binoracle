[project]
name = "binoracle"
version = "0.1.0"
description = "Local LLM copilot for binary reverse engineering and exploitation, grounded on real analysis oracles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
authors = [{ name = "beafn28" }]
keywords = ["reverse-engineering", "exploitation", "llm", "local", "radare2", "angr", "ctf"]

# Core runtime uses ONLY the Python standard library (urllib, sqlite3, argparse).
# This keeps the tool fully local and installable with zero pip deps for the skeleton.
dependencies = []

[project.optional-dependencies]
# Analysis oracles are optional and load lazily. Install what you have/need.
elf = ["pyelftools>=0.30"]
r2 = ["r2pipe>=1.8"]
symbolic = ["angr>=9.2"]
pwn = ["pwntools>=4.11"]
disasm = ["capstone>=5.0"]
all = ["pyelftools>=0.30", "r2pipe>=1.8", "angr>=9.2", "capstone>=5.0", "pwntools>=4.11"]
dev = ["pytest>=8.0"]

[project.scripts]
binoracle = "binoracle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["binoracle*"]

[tool.setuptools.package-data]
binoracle = ["kb/*.md", "kb/**/*.md", "kb/skills/LICENSE"]
