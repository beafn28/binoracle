<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
      .title  { font-size:13px; font-weight:700; fill:#e6edf3; }
      .sub    { font-size:10.5px; fill:#8b949e; }
      .label  { font-size:11px; font-weight:600; fill:#58a6ff; }
      .note   { font-size:10px; fill:#8b949e; font-style:italic; }
      .mono   { font-family:'JetBrains Mono','Courier New',monospace; font-size:10px; fill:#c9d1d9; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" rx="14" fill="#0d1117"/>

  <!-- Outer border -->
  <rect x="20" y="20" width="860" height="520" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header band -->
  <rect x="20" y="20" width="860" height="44" rx="10" fill="#161b22"/>
  <rect x="20" y="50" width="860" height="14" fill="#161b22"/>
  <text x="450" y="47" text-anchor="middle" class="title" font-size="15">binoracle — System Architecture</text>

  <!-- ── INTERFACE LAYER ── -->
  <rect x="40" y="80" width="820" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="99" class="label">Interface Layer</text>

  <!-- CLI box -->
  <rect x="80" y="107" width="180" height="32" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="170" y="128" text-anchor="middle" class="title">CLI  (50+ commands)</text>

  <!-- MCP box -->
  <rect x="360" y="107" width="180" height="32" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="450" y="128" text-anchor="middle" class="title">MCP Server  (~100 tools)</text>

  <!-- Web box -->
  <rect x="640" y="107" width="180" height="32" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="730" y="128" text-anchor="middle" class="title">Web UI  (Flask)</text>

  <!-- Connector lines from interface to workflow -->
  <line x1="170" y1="139" x2="170" y2="175" stroke="#30363d" stroke-width="1.5"/>
  <line x1="450" y1="139" x2="450" y2="175" stroke="#30363d" stroke-width="1.5"/>
  <line x1="730" y1="139" x2="730" y2="175" stroke="#30363d" stroke-width="1.5"/>
  <line x1="170" y1="175" x2="730" y2="175" stroke="#30363d" stroke-width="1.5"/>
  <line x1="450" y1="175" x2="450" y2="195" stroke="#30363d" stroke-width="1.5"/>
  <!-- Arrow head -->
  <polygon points="450,195 445,185 455,185" fill="#30363d"/>

  <!-- ── WORKFLOW LAYER ── -->
  <rect x="250" y="195" width="400" height="80" rx="8" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="450" y="216" text-anchor="middle" class="label">Workflow Layer</text>
  <text x="310" y="234" text-anchor="middle" class="mono">cve_agent</text>
  <text x="310" y="250" text-anchor="middle" class="mono">genericverify</text>
  <text x="450" y="234" text-anchor="middle" class="mono">autopwn · chainanalyzer</text>
  <text x="450" y="250" text-anchor="middle" class="mono">rop · heap · fmt · srop</text>
  <text x="590" y="234" text-anchor="middle" class="mono">wpverify · joomlaverify</text>
  <text x="590" y="250" text-anchor="middle" class="mono">audit · vuln_hunt</text>

  <!-- Lines from workflow to 3 bottom layers -->
  <line x1="340" y1="275" x2="175" y2="315" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="175,315 178,303 185,310" fill="#30363d"/>
  <line x1="450" y1="275" x2="450" y2="315" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="450,315 445,305 455,305" fill="#30363d"/>
  <line x1="560" y1="275" x2="725" y2="315" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="725,315 715,308 722,302" fill="#30363d"/>

  <!-- ── ORACLE LAYER ── -->
  <rect x="40" y="315" width="260" height="130" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="170" y="336" text-anchor="middle" class="label" fill="#3fb950">Oracle Layer</text>
  <text x="90" y="354" class="sub">Deterministic ground-truth analysis</text>
  <text x="90" y="374" class="mono">radare2 · pyelftools · pwntools</text>
  <text x="90" y="390" class="mono">angr · pefile · jadx · LIEF</text>
  <text x="90" y="406" class="mono">ELF · PE · Mach-O · APK · .NET</text>
  <text x="90" y="422" class="mono">WASM · EVM · SQLite · Flutter</text>

  <!-- ── LLM BRIDGE ── -->
  <rect x="320" y="315" width="260" height="130" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="450" y="336" text-anchor="middle" class="label" fill="#bc8cff">LLM Bridge</text>
  <text x="340" y="354" class="sub">Local-first, OpenAI-compatible</text>
  <rect x="340" y="362" width="220" height="28" rx="6" fill="#21262d"/>
  <text x="450" y="381" text-anchor="middle" class="mono" font-weight="700" fill="#3fb950">● Qwen 2.5 Coder 7B  (Ollama)</text>
  <text x="340" y="408" class="mono">BINORACLE_BACKEND=openai</text>
  <text x="340" y="424" class="mono">BINORACLE_BASE_URL=localhost</text>
  <text x="340" y="440" class="mono">BINORACLE_MODEL=qwen2.5-coder:7b</text>

  <!-- ── LAB SCAFFOLDER ── -->
  <rect x="600" y="315" width="260" height="130" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="730" y="336" text-anchor="middle" class="label" fill="#d29922">Lab Scaffolder</text>
  <text x="620" y="354" class="sub">Ephemeral Docker Compose labs</text>
  <text x="620" y="374" class="mono">pip (Flask/Python)</text>
  <text x="620" y="390" class="mono">gem (Rails/Rack/Sinatra)</text>
  <text x="620" y="406" class="mono">npm / Next.js</text>
  <text x="620" y="422" class="mono">maven (Spring/Log4j)</text>
  <text x="790" y="374" class="mono">php (Composer)</text>
  <text x="790" y="390" class="mono">WordPress</text>
  <text x="790" y="406" class="mono">Joomla · Drupal</text>
  <text x="790" y="422" class="mono">Apache httpd</text>

  <!-- ── BOTTOM: Playwright + Report ── -->
  <line x1="730" y1="445" x2="730" y2="468" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="730,468 725,458 735,458" fill="#30363d"/>
  <rect x="560" y="468" width="340" height="40" rx="7" fill="#21262d" stroke="#30363d"/>
  <text x="730" y="485" text-anchor="middle" class="title" font-size="11.5">Playwright Verifier</text>
  <text x="730" y="500" text-anchor="middle" class="sub">screenshots · HTTP responses · PoC code · HTML report</text>

  <!-- Zero cloud note -->
  <rect x="40" y="468" width="260" height="40" rx="7" fill="#0d2318" stroke="#238636" stroke-width="1"/>
  <text x="170" y="485" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">🔒 Zero cloud calls</text>
  <text x="170" y="500" text-anchor="middle" class="sub">All data stays on your machine</text>
</svg>
