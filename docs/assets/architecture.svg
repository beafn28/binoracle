<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#64748b"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#22c55e"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#a855f7"/>
    </marker>
    <marker id="arr-y" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#f59e0b"/>
    </marker>
    <marker id="arr-c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#0ea5e9"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" rx="16" fill="#ffffff"/>
  <rect width="1200" height="760" rx="16" fill="url(#dots)"/>

  <!-- ═══ TITLE ═══ -->
  <text x="600" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a" letter-spacing="-0.3">binoracle — System Architecture</text>

  <!-- ═══ INTERFACE LAYER ═══ -->
  <rect x="20" y="56" width="1160" height="96" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="40" y="74" font-size="10" font-weight="700" fill="#2563eb" letter-spacing="1">INTERFACE LAYER</text>

  <rect x="48" y="80" width="220" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="158" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">CLI</text>
  <text x="158" y="123" text-anchor="middle" font-size="11" fill="#3b82f6">50+ commands</text>

  <rect x="490" y="80" width="220" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">MCP Server</text>
  <text x="600" y="123" text-anchor="middle" font-size="11" fill="#3b82f6">~100 tools</text>

  <rect x="932" y="80" width="220" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1042" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Web UI</text>
  <text x="1042" y="123" text-anchor="middle" font-size="11" fill="#3b82f6">Flask · patch intel panel · confidence badges</text>

  <!-- ═══ Interface → Workflow connectors ═══ -->
  <polyline points="158,136 158,172 600,172" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polyline points="1042,136 1042,172 600,172" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="600" y1="136" x2="600" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══ WORKFLOW LAYER ═══ -->
  <rect x="100" y="194" width="1000" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="214" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" letter-spacing="1">WORKFLOW LAYER</text>
  <text x="260" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">cve_agent · cve_state</text>
  <text x="260" y="258" text-anchor="middle" font-size="10" fill="#64748b">state machine · self-repair · correlate</text>
  <text x="600" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">autopwn · chainanalyzer · autopoc</text>
  <text x="600" y="258" text-anchor="middle" font-size="10" fill="#64748b">rop · heap · fmt · srop · infoleak</text>
  <text x="940" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">wpverify · joomlaverify · genericverify</text>
  <text x="940" y="258" text-anchor="middle" font-size="10" fill="#64748b">error-based · header inj · JSON body · param rotation</text>

  <!-- ═══ Workflow → 4 layers ═══ -->
  <line x1="220" y1="294" x2="130" y2="336" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arr-g)"/>
  <line x1="480" y1="294" x2="470" y2="336" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arr-p)"/>
  <line x1="720" y1="294" x2="730" y2="336" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-y)"/>
  <line x1="960" y1="294" x2="1070" y2="336" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arr-c)"/>

  <!-- ═══ ORACLE LAYER ═══ -->
  <rect x="20" y="338" width="320" height="170" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a" letter-spacing="1">ORACLE LAYER</text>
  <text x="180" y="374" text-anchor="middle" font-size="10" fill="#4ade80">Deterministic ground-truth</text>
  <text x="38" y="396" font-size="11" fill="#166534" font-weight="600">radare2 · pyelftools · pwntools</text>
  <text x="38" y="414" font-size="11" fill="#166534">angr · pefile · jadx · LIEF</text>
  <text x="38" y="432" font-size="11" fill="#166534">Ghidra · JEB (Android native)</text>
  <text x="38" y="450" font-size="11" fill="#15803d">ELF · PE · Mach-O · APK · .so</text>
  <text x="38" y="468" font-size="11" fill="#15803d">WASM · EVM · SQLite · .NET</text>
  <text x="38" y="486" font-size="11" fill="#15803d">Frida · LibFuzzer · concolic</text>

  <!-- ═══ LLM BRIDGE ═══ -->
  <rect x="360" y="338" width="320" height="170" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#9333ea" letter-spacing="1">LLM BRIDGE</text>
  <text x="520" y="374" text-anchor="middle" font-size="10" fill="#c084fc">Local-first · OpenAI-compatible</text>
  <rect x="386" y="382" width="268" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="520" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Qwen 2.5 Coder 7B (Ollama)</text>
  <text x="520" y="432" text-anchor="middle" font-size="10" fill="#7c3aed" font-family="'Courier New',monospace">BINORACLE_BACKEND=openai</text>
  <text x="520" y="448" text-anchor="middle" font-size="10" fill="#7c3aed" font-family="'Courier New',monospace">BINORACLE_BASE_URL=localhost</text>
  <text x="520" y="464" text-anchor="middle" font-size="10" fill="#7c3aed" font-family="'Courier New',monospace">BINORACLE_MODEL=qwen2.5-coder:7b</text>
  <text x="520" y="492" text-anchor="middle" font-size="10" fill="#a855f7">LoRA fine-tune → GGUF → Ollama push</text>

  <!-- ═══ LAB SCAFFOLDER ═══ -->
  <rect x="700" y="338" width="320" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706" letter-spacing="1">LAB SCAFFOLDER</text>
  <text x="860" y="374" text-anchor="middle" font-size="10" fill="#fbbf24">Ephemeral Docker · resource limits</text>
  <text x="718" y="396" font-size="11" fill="#92400e">Flask · Rails · npm · maven</text>
  <text x="718" y="414" font-size="11" fill="#92400e">WordPress · Joomla · Drupal</text>
  <text x="718" y="432" font-size="11" fill="#92400e">Ghost · Strapi · Craft CMS</text>
  <text x="718" y="450" font-size="11" fill="#b45309">--cpus · --memory · --pids-limit</text>
  <text x="718" y="468" font-size="11" fill="#b45309">container_healthy() · self-repair</text>
  <text x="718" y="486" font-size="11" fill="#b45309">restart_if_stopped() · OOMKill</text>

  <!-- ═══ INTELLIGENCE LAYER ═══ -->
  <rect x="1040" y="338" width="140" height="170" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="1">INTEL</text>
  <text x="1058" y="376" font-size="10" fill="#0284c7">patch_intel</text>
  <text x="1058" y="392" font-size="10" fill="#0284c7">cve_correlate</text>
  <text x="1058" y="408" font-size="10" fill="#0284c7">cvelookup</text>
  <text x="1058" y="424" font-size="10" fill="#0284c7">NVD + OSV</text>
  <text x="1058" y="440" font-size="10" fill="#38bdf8">fix commits</text>
  <text x="1058" y="456" font-size="10" fill="#38bdf8">patch diff</text>
  <text x="1058" y="472" font-size="10" fill="#38bdf8">timeline</text>
  <text x="1058" y="488" font-size="10" fill="#38bdf8">priority rank</text>

  <!-- ═══ Connectors: Lab → Verifier, LLM → Verifier ═══ -->
  <line x1="860" y1="508" x2="860" y2="544" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="508" x2="520" y2="544" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- ═══ VERIFIER LAYER ═══ -->
  <rect x="100" y="546" width="860" height="62" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Verifier (wpverify · genericverify · drupalverify)</text>
  <text x="530" y="587" text-anchor="middle" font-size="10" fill="#4ade80">HTTP · header injection · LFI param rotation · error-based SQLi · JSON body · evidence SHA-256 · confidence scoring · reproduce.sh</text>

  <!-- ═══ STATE DB + PERSIST ═══ -->
  <line x1="530" y1="608" x2="530" y2="640" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="100" y="642" width="860" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="664" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Output + Persistence</text>
  <text x="530" y="683" text-anchor="middle" font-size="10" fill="#64748b">HTML report · CVE State DB (SQLite WAL) · GitHub Pages gallery (33+ reports) · GGUF checkpoint · Ollama · HF Hub</text>

  <!-- ═══ ZERO CLOUD BADGE ═══ -->
  <rect x="980" y="642" width="200" height="62" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="1080" y="664" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">Zero cloud calls</text>
  <text x="1080" y="683" text-anchor="middle" font-size="10" fill="#86efac">All data stays on your machine</text>

  <!-- Outer border -->
  <rect x="1" y="1" width="1198" height="758" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1"/>
</svg>
