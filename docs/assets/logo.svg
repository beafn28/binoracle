<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="hex-clip">
      <polygon points="60,6 108,33 108,87 60,114 12,87 12,33"/>
    </clipPath>
  </defs>

  <!-- Hexagon background -->
  <polygon points="60,6 108,33 108,87 60,114 12,87 12,33"
           fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Inner hex ring -->
  <polygon points="60,16 100,38 100,82 60,104 20,82 20,38"
           fill="none" stroke="#1f3a5f" stroke-width="1"/>

  <!-- Circuit traces: horizontal -->
  <line x1="30" y1="60" x2="48" y2="60" stroke="#1f6feb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="60" x2="90" y2="60" stroke="#1f6feb" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Circuit traces: diagonal upper -->
  <line x1="42" y1="38" x2="50" y2="50" stroke="#1f6feb" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="38" x2="70" y2="50" stroke="#1f6feb" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Circuit traces: diagonal lower -->
  <line x1="42" y1="82" x2="50" y2="70" stroke="#1f6feb" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="82" x2="70" y2="70" stroke="#1f6feb" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Central eye shape -->
  <ellipse cx="60" cy="60" rx="18" ry="10" fill="none" stroke="#58a6ff" stroke-width="1.8"/>

  <!-- Pupil -->
  <circle cx="60" cy="60" r="5.5" fill="#58a6ff"/>
  <circle cx="60" cy="60" r="2.5" fill="#0d1117"/>

  <!-- Corner nodes -->
  <circle cx="30" cy="60" r="2.5" fill="#58a6ff"/>
  <circle cx="90" cy="60" r="2.5" fill="#58a6ff"/>
  <circle cx="42" cy="38" r="2" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>
  <circle cx="78" cy="38" r="2" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>
  <circle cx="42" cy="82" r="2" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>
  <circle cx="78" cy="82" r="2" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>

  <!-- Binary bits: top -->
  <text x="45" y="29" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#30363d">01</text>
  <text x="75" y="29" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#30363d">10</text>

  <!-- Binary bits: bottom -->
  <text x="45" y="99" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#30363d">10</text>
  <text x="75" y="99" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#30363d">01</text>
</svg>
