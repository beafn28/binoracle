<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" aria-label="binoracle">
  <defs>
    <radialGradient id="bg-ball" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#2a3550"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <radialGradient id="glow-ring" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#00cfff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00cfff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="38%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ball-clip">
      <circle cx="100" cy="93" r="77"/>
    </clipPath>
  </defs>

  <!-- outer glow halo -->
  <circle cx="100" cy="93" r="88" fill="url(#glow-ring)"/>

  <!-- ball body -->
  <circle cx="100" cy="93" r="77" fill="url(#bg-ball)"/>

  <!-- cyan ring stroke -->
  <circle cx="100" cy="93" r="77" fill="none" stroke="#00cfff" stroke-width="2.2" opacity="0.9" filter="url(#glow)"/>

  <!-- inner shine overlay -->
  <circle cx="100" cy="93" r="77" fill="url(#shine)"/>

  <!-- glint dot -->
  <circle cx="80" cy="58" r="4.5" fill="#ffffff" opacity="0.7"/>

  <!-- binary / hex text grid -->
  <g clip-path="url(#ball-clip)" font-family="monospace" font-size="13.5" font-weight="600" fill-opacity="0.92">
    <text x="52"  y="82"  fill="#00cfff">1001</text>
    <text x="122" y="82"  fill="#ff9b00">0xE9</text>
    <text x="62"  y="102" fill="#00cfff">0110</text>
    <text x="124" y="102" fill="#00cfff">1011</text>
    <text x="52"  y="122" fill="#ff9b00">RCE</text>
    <text x="118" y="122" fill="#00cfff">0101</text>
    <text x="62"  y="142" fill="#00cfff">1100</text>
    <text x="118" y="142" fill="#ff9b00">0x90</text>
  </g>

  <!-- pedestal -->
  <ellipse cx="100" cy="174" rx="52" ry="10" fill="#0e1829" stroke="#00cfff" stroke-width="1.6" opacity="0.85"/>
  <rect x="84" y="168" width="32" height="10" rx="3" fill="#0a1220"/>
  <ellipse cx="100" cy="167" rx="38" ry="6.5" fill="#0d1826" stroke="#00cfff" stroke-width="1.4" opacity="0.7"/>

  <!-- brand text -->
  <text x="100" y="202" text-anchor="middle"
        font-family="monospace" font-size="18" font-weight="700"
        fill="#dde3f0" letter-spacing="1.5">
    bin<tspan fill="#ff9b00">0</tspan>racle
  </text>
</svg>
