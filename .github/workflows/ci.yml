name: ci
# Runs on:
#   push     — any branch touching binoracle/ code, tests/, or the CI config itself
#   pull_request — same path filter, so PRs get a gate before merge
#   workflow_dispatch — manual run from the Actions tab (no-cost on demand)
#
# Pushes to branches outside the path filter (docs-only, assets, etc.) still skip CI.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "binoracle/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "setup.cfg"
  pull_request:
    paths:
      - "binoracle/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "setup.cfg"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install radare2
        # gdb added here too -- real gap, not local noise: confirmed live by reproducing this
        # exact runner setup (gdb absent, matching a stock ubuntu-latest image, which does NOT
        # ship it by default) outside CI. oracles/heap_dynamic.py's dynamic double-free/UAF
        # tools (heap_confirm_double_free and friends) gate their own registration on
        # `shutil.which("gdb")`, so test_heap_dynamic_registered_only_when_dynamic_enabled
        # failed on a bare runner for a real, concrete reason, not flakiness.
        #
        # wine added here too -- another real gap, not local noise: workflows/autopoc_pe.py's
        # dynamic ret2win-over-PE verification (and test_autopoc_pe_verifies_ret2win_under_wine)
        # had never actually run on CI (wine_available() was always False on a bare runner, so
        # the test always skipped) -- confirmed live outside CI, where it surfaced a real bug
        # now fixed (autopoc_pe._ensure_wine_ready: a cold Wine prefix's one-time ~55s init ate
        # the FIRST offset attempt's own budget_s, so the one offset that was actually correct
        # always timed out before the rest of the (wrong) offsets were tried -- guaranteed
        # false negative on any fresh environment, CI included, until that first run warmed it).
        #
        # gcc-mingw-w64-x86-64 added here too, for a DIFFERENT real gap confirmed in vivo:
        # samples/build.sh's win_chall.exe step always preferred Docker (debian:12's own
        # gcc-mingw-w64-x86-64, GCC 12) over the host's mingw whenever Docker was available --
        # this runner has Docker, so it always took that branch, building win_chall.exe with a
        # DIFFERENT major GCC version than every local verification run tonight (Ubuntu's own
        # package is GCC 13). That toolchain difference -- not angr nondeterminism, not Python
        # version, not CPU count, all ruled out first -- is the confirmed cause of
        # test_symbolic_angr_reachable_works_on_pe_via_mingw_simprocedures failing on CI 3/3
        # while passing locally 18+/18+: a binarily different win_chall.exe, built without
        # anyone noticing. Installing it here flips samples/build.sh's (now host-first) branch
        # to use the SAME toolchain already verified repeatedly, instead of Docker's.
        run: sudo apt-get update && sudo apt-get install -y radare2 build-essential gdb wine gcc-mingw-w64-x86-64
      - name: Install binoracle (+ optional oracles, dev tools)
        # pwntools (the 'pwn' extra) was missing here -- real gap, not local noise: confirmed
        # live by reproducing this exact install command and test run outside CI. Several
        # live-verified exploit-chain tests (ROP/SROP cyclic-pattern offsets, chainanalyzer's
        # execve-syscall driver) depend on pwntools and were silently reporting
        # "pwntools no disponible: No module named 'pwn'" instead of actually verifying.
        #
        # 'symbolic' (angr) and 'frida' were ALSO missing -- another real gap, not deliberate:
        # confirmed live that oracles/concolic.py's and oracles/frida_dynamic.py's entire test
        # suites (symbolic replay/constraint-solving against a real gdb trace, cross-platform
        # double-free/UAF confirmation) were silently SKIPPING on every CI run to date (each
        # import-guards its own optional dependency and calls pytest.skip() when absent) --
        # never actually executed here, only ever locally. Added both so these oracles are
        # actually exercised on CI, not just locally.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[elf,dev,web,pwn,symbolic,frida]" r2pipe cvss olefile
      - name: Build the practice corpus (samples/bin -- gitignored, never checked in)
        # samples/build.sh falls back to the host gcc on Linux when the gcc:13 Docker image
        # isn't already present (which it isn't on a fresh runner) -- build-essential above
        # covers it. Several tests (default_corpus, exploit_trainer, chainanalyzer...) need
        # these real compiled ELFs; without this step they silently find an empty corpus.
        run: bash samples/build.sh
      - name: Compile check
        run: python -m compileall -q binoracle
      - name: Lint (ruff -- pyflakes correctness checks, hard gate)
        run: ruff check binoracle
      - name: Type check (mypy -- advisory for now, see pyproject.toml's [tool.mypy] comment)
        run: mypy binoracle --ignore-missing-imports || true
      - name: Run tests with coverage
        # 20% is a deliberately conservative floor, not an aspiration -- it's the gate's FIRST
        # value, set before a full-suite coverage measurement finished (the suite is slow: many
        # tests drive real sandboxes/angr/docker). Raise it to the real measured value (rounded
        # down a couple points for headroom) once that run completes, then again over time as
        # coverage grows -- never lower it without a documented reason.
        run: |
          pytest -q tests/ \
            --cov=binoracle \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=20 \
            --tb=short \
            -v 2>&1 | tee pytest-report.txt
      - name: Generate regression summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os, datetime

          cov_ok = os.path.exists("coverage.json")
          rpt_ok = os.path.exists("pytest-report.txt")
          passed = failed = skipped = 0
          coverage_pct = 0.0

          if rpt_ok:
              with open("pytest-report.txt") as f:
                  for line in f:
                      if "passed" in line:
                          import re
                          m = re.search(r"(\d+) passed", line)
                          if m: passed = int(m.group(1))
                          m = re.search(r"(\d+) failed", line)
                          if m: failed = int(m.group(1))
                          m = re.search(r"(\d+) skipped", line)
                          if m: skipped = int(m.group(1))
          if cov_ok:
              with open("coverage.json") as f:
                  d = json.load(f)
                  coverage_pct = d.get("totals", {}).get("percent_covered", 0.0)

          summary = {
              "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
              "run_id":    os.environ.get("GITHUB_RUN_ID", "local"),
              "sha":       os.environ.get("GITHUB_SHA", "unknown")[:8],
              "branch":    os.environ.get("GITHUB_REF_NAME", "unknown"),
              "passed":    passed,
              "failed":    failed,
              "skipped":   skipped,
              "coverage":  round(coverage_pct, 1),
              "status":    "PASS" if failed == 0 else "FAIL",
          }
          with open("regression-summary.json", "w") as f:
              json.dump(summary, f, indent=2)
          print(json.dumps(summary, indent=2))
          EOF
      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ github.run_id }}
          path: |
            pytest-report.txt
            coverage.json
            regression-summary.json
          retention-days: 90
