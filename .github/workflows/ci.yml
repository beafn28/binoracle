name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install radare2
        run: sudo apt-get update && sudo apt-get install -y radare2
      - name: Install binoracle (+ optional oracles)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[elf]" r2pipe pytest
      - name: Compile check
        run: python -m compileall -q binoracle
      - name: Run tests
        run: pytest -q tests/
